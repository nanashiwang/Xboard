name: Upstream Bounded Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit bounded operation (prepare never approves or applies)
        type: choice
        required: true
        default: prepare
        options: [recipient, import-reviewed, secure-probe-config, inspect-environment, accept-source-address, prepare, audit-scope, restore-scope, snapshot, verify-baseline, verify-success, verify-withdrawn, withdraw, apply_hidden, publish, rollback]
      plan_id:
        description: Prepared private plan ID (empty for prepare/audit-scope/inspect-environment/secure-probe-config)
        type: string
        default: ''
      plan_sha256:
        description: Exact prepared plan byte SHA256
        type: string
        default: ''
      execution_id:
        description: Exact maintenance receipt execution ID (required for verify)
        type: string
        default: ''
      selection:
        description: JSON object of selected key to manually reviewed candidate digest (null for verification or withdrawal only)
        type: string
        default: '{}'
      ciphertext:
        description: RSA-OAEP ciphertext envelope JSON for import-reviewed only (no plaintext endpoints or pins; maximum 60 KiB)
        type: string
        default: '{}'

permissions:
  contents: read

concurrency:
  group: xboard-production-management
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: inputs.operation == 'prepare'
        with:
          go-version: '1.26.2'
          cache-dependency-path: .docker/upstream/quic-observer/go.sum
      - name: Test and build pinned QUIC certificate observer
        if: inputs.operation == 'prepare'
        working-directory: .docker/upstream/quic-observer
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go test -mod=readonly -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/quic-observer-linux-amd64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/quic-observer-darwin-arm64" .
          chmod 700 "$RUNNER_TEMP/quic-observer-linux-amd64"
      - name: Install SSH client helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Execute the explicitly selected bounded operation
        env:
          SSHPASS: ${{ secrets.XBOARD_SSH_PASSWORD }}
          OPERATION: ${{ inputs.operation }}
          PLAN_ID: ${{ inputs.plan_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          SELECTION: ${{ inputs.selection }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          CIPHERTEXT: ${{ inputs.ciphertext }}
        run: |
          set -euo pipefail
          umask 077
          python3 .docker/upstream/control.py --from-env > "$RUNNER_TEMP/upstream-control.json"
          test -n "$SSHPASS"
          install -d -m 700 ~/.ssh
          echo '107.173.191.23 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMaqwGqo+a7RFrOqJk84N1s/W0q/9z/JE/12Lu7z0YfC' > ~/.ssh/xboard_known_hosts
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/xboard_known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 'cd /root/Xboard && docker compose exec -T xboard php -l' < .docker/upstream/snapshot.php
          remote_dir=$(sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 'umask 077; mktemp -d /tmp/xboard-upstream-prepare.XXXXXX')
          [[ "$remote_dir" =~ ^/tmp/xboard-upstream-prepare\.[A-Za-z0-9]+$ ]]
          quic_sha=''
          if [ "$OPERATION" = prepare ]; then
            quic_sha=$(sha256sum "$RUNNER_TEMP/quic-observer-linux-amd64" | cut -d ' ' -f 1)
            [[ "$quic_sha" =~ ^[a-f0-9]{64}$ ]]
          fi
          trap 'sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "rm -f -- $remote_dir/prepare.py $remote_dir/snapshot.php $remote_dir/guard.py $remote_dir/guard-apply.php $remote_dir/allocation.json $remote_dir/quic-observer-linux-amd64 $remote_dir/maintain.py $remote_dir/recovery.php $remote_dir/backup-database.py $remote_dir/control.py $remote_dir/public_verify.py $remote_dir/probe-scope.php $remote_dir/scope_restore.py $remote_dir/inspect_environment.py $remote_dir/accept_source_address.py $remote_dir/secure_probe_config.py $remote_dir/import_reviewed.py; rmdir -- $remote_dir"' EXIT
          sshpass -e scp "${ssh_opts[@]}" .docker/upstream/{prepare.py,snapshot.php,guard.py,guard-apply.php,allocation.json,maintain.py,recovery.php,control.py,public_verify.py,probe-scope.php,scope_restore.py,inspect_environment.py,accept_source_address.py,secure_probe_config.py,import_reviewed.py} .docker/production/backup-database.py "root@107.173.191.23:$remote_dir/"
          if [ "$OPERATION" = prepare ]; then
            sshpass -e scp "${ssh_opts[@]}" "$RUNNER_TEMP/quic-observer-linux-amd64" "root@107.173.191.23:$remote_dir/"
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "chmod 700 '$remote_dir/quic-observer-linux-amd64'"
          fi
          for file in recovery.php guard-apply.php probe-scope.php; do
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 'cd /root/Xboard && docker compose exec -T xboard php -l' < ".docker/upstream/$file"
          done
          sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "PYTHONDONTWRITEBYTECODE=1 python3 '$remote_dir/control.py' --quic-sha256 '$quic_sha'" < "$RUNNER_TEMP/upstream-control.json"
