name: Website Relay Origin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, prepare, apply, verify, or roll back the origin relay settings
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - prepare
          - apply
          - verify
          - rollback
      change_id:
        description: Guarded backup generation (lowercase letters, digits, hyphens)
        required: true
        default: 20261022-flawless-website
        type: string

permissions:
  contents: read

concurrency:
  group: xboard-production-management
  cancel-in-progress: false

jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run the selected guarded origin operation
        env:
          SSHPASS: ${{ secrets.XBOARD_SSH_PASSWORD }}
          OPERATION: ${{ inputs.operation }}
          CHANGE_ID: ${{ inputs.change_id }}
        run: |
          set -euo pipefail
          case "$OPERATION" in inspect|prepare|apply|verify|rollback) ;; *) exit 1 ;; esac
          [[ "$CHANGE_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          test -n "$SSHPASS"
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path(".docker/production/website-relay-origin.py").read_text())'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          # Same previously verified origin host key as configure-primary-domain.yml.
          echo '107.173.191.23 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMaqwGqo+a7RFrOqJk84N1s/W0q/9z/JE/12Lu7z0YfC' > ~/.ssh/xboard_known_hosts
          chmod 600 ~/.ssh/xboard_known_hosts
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/xboard_known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          # stdin execution avoids storing a helper on the origin. Only the
          # selected operation may modify the hash-guarded taige vhost.
          sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 \
            "python3 - '$OPERATION' --change-id '$CHANGE_ID'" < .docker/production/website-relay-origin.py
