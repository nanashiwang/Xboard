name: Capybara Windows Diagnostics
on:
  push:
    branches: [master]
    paths: ['scripts/capybara/**', '.github/workflows/capybara-diagnostics.yml']
  pull_request:
    paths: ['scripts/capybara/**', '.github/workflows/capybara-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows PowerShell 5.1 diagnostics
        shell: powershell
        run: '& ./scripts/capybara/test-diagnostics.ps1'
