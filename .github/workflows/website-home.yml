name: Website Home Checks
on:
  push:
    branches: [master]
    paths: ['theme/Xboard/dashboard.blade.php', 'resources/views/home/**', 'resources/views/client/**', 'app/Services/ClientDownloadService.php', 'public/assets/client-downloads.*', 'public/assets/desktop-login*', 'app/Http/Controllers/V1/Desktop/**', 'app/Http/Requests/Client/**', 'app/Http/Routes/V1/DesktopRoute.php', 'app/Services/Client/**', 'database/migrations/*client*', 'tests/Feature/Desktop/**', 'app/Protocols/SingBox.php', 'resources/rules/default.sing-box.json', 'desktop/capybara/scripts/browser-login.test.mjs', '.docker/downloads/**', '.docker/knowledge/**', 'tests/Operations/test_knowledge_sync.py', 'tests/Operations/test_download_sync.py', 'public/assets/capybara-home/**', 'routes/web.php', 'tests/Feature/Desktop/WebsiteHomeTest.php', 'tests/Frontend/website-home.test.cjs', 'tests/Feature/Desktop/ClientDownloadTest.php', '.github/workflows/website-home.yml']
  pull_request:
    paths: ['theme/Xboard/dashboard.blade.php', 'resources/views/home/**', 'resources/views/client/**', 'app/Services/ClientDownloadService.php', 'public/assets/client-downloads.*', 'public/assets/desktop-login*', 'app/Http/Controllers/V1/Desktop/**', 'app/Http/Requests/Client/**', 'app/Http/Routes/V1/DesktopRoute.php', 'app/Services/Client/**', 'database/migrations/*client*', 'tests/Feature/Desktop/**', 'app/Protocols/SingBox.php', 'resources/rules/default.sing-box.json', 'desktop/capybara/scripts/browser-login.test.mjs', '.docker/downloads/**', '.docker/knowledge/**', 'tests/Operations/test_knowledge_sync.py', 'tests/Operations/test_download_sync.py', 'public/assets/capybara-home/**', 'routes/web.php', 'tests/Feature/Desktop/WebsiteHomeTest.php', 'tests/Frontend/website-home.test.cjs', 'tests/Feature/Desktop/ClientDownloadTest.php', '.github/workflows/website-home.yml']
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, redis, gmp, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install pinned sing-box for complete subscription checks
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/sing-box.tar.gz" https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-linux-amd64-musl.tar.gz
          echo "150456f94fcf936fc2519de28d856422fb671a1ff181cd909b78f20e208fdcb8  $RUNNER_TEMP/sing-box.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          echo "SING_BOX_BINARY=$RUNNER_TEMP/sing-box-1.13.19-linux-amd64-musl/sing-box" >> "$GITHUB_ENV"
      - name: Check complete sing-box subscriptions
        run: vendor/bin/phpunit tests/Feature/Desktop/SingBoxTemplateTest.php
      - run: node --check public/assets/capybara-home/home.js
      - run: node --check public/assets/client-downloads.js
      - run: npm ci --prefix desktop/capybara
      - run: node --test desktop/capybara/scripts/browser-login.test.mjs
      - run: node --test tests/Frontend/website-home.test.cjs
      - run: python3 -m unittest discover -s tests/Operations -p test_knowledge_sync.py
      - run: python3 -m unittest discover -s tests/Operations -p test_download_sync.py
      - run: vendor/bin/phpunit tests/Feature/Desktop
      - run: php artisan view:cache
