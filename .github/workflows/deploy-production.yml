name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Remote operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - inspect-mail
          - inspect-dedicated
          - preview-owned-dedicated
          - attach-owned-dedicated
          - verify-owned-dedicated
          - baseline-owned-dedicated
          - deploy
          - sync-downloads
          - sync-download-guide
          - install-cli
      image_revision:
        description: Expected full image commit SHA (blank uses workflow commit)
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: xboard-production-management
  cancel-in-progress: false

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH client helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect, install CLI or deploy production
        env:
          SSHPASS: ${{ secrets.XBOARD_SSH_PASSWORD }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_REVISION: ${{ inputs.image_revision || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Expected image revision must be a full lowercase commit SHA.' >&2
            exit 1
          fi
          test -n "$SSHPASS"
          install -d -m 700 ~/.ssh
          # Same verified host key as configure-primary-domain.yml.
          echo '107.173.191.23 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMaqwGqo+a7RFrOqJk84N1s/W0q/9z/JE/12Lu7z0YfC' > ~/.ssh/xboard_known_hosts
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/xboard_known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15)
          if [ "$OPERATION" = sync-downloads ]; then
            remote_dir=$(sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 'test -d /srv/xboard-downloads && mktemp -d /tmp/xboard-downloads.XXXXXX')
            trap 'sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "rm -f -- $remote_dir/sync.py $remote_dir/manifest.json; rmdir -- $remote_dir"' EXIT
            sshpass -e scp "${ssh_opts[@]}" .docker/downloads/{sync.py,manifest.json} "root@107.173.191.23:$remote_dir/"
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "python3 '$remote_dir/sync.py' /srv/xboard-downloads"
            exit 0
          fi
          if [ "$OPERATION" = sync-download-guide ]; then
            remote_dir=$(sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 'mktemp -d /tmp/xboard-guide.XXXXXX')
            trap 'sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "rm -f -- $remote_dir/sync.py $remote_dir/manifest.json $remote_dir/articles/05-downloads.md; rmdir -- $remote_dir/articles $remote_dir"' EXIT
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "mkdir '$remote_dir/articles'"
            sshpass -e scp "${ssh_opts[@]}" .docker/knowledge/{sync.py,manifest.json} "root@107.173.191.23:$remote_dir/"
            sshpass -e scp "${ssh_opts[@]}" .docker/knowledge/articles/05-downloads.md "root@107.173.191.23:$remote_dir/articles/"
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 \
              "python3 '$remote_dir/sync.py' --database /root/Xboard/.docker/.data/database.sqlite --article-id 5 --backup-dir /root/xboard-backups/knowledge --apply"
            exit 0
          fi
          if [ "$OPERATION" = inspect-dedicated ]; then
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 \
              'cd /root/Xboard && docker compose exec -T xboard php' < .docker/dedicated/inspect.php
            exit 0
          fi
          if [ "$OPERATION" = baseline-owned-dedicated ] || [ "$OPERATION" = verify-owned-dedicated ]; then
            verify_args=
            if [ "$OPERATION" = baseline-owned-dedicated ]; then verify_args=--baseline; fi
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 \
              "cd /root/Xboard && python3 - $verify_args" < .docker/dedicated/verify-owned.py
            exit 0
          fi
          if [ "$OPERATION" = preview-owned-dedicated ] || [ "$OPERATION" = attach-owned-dedicated ]; then
            actual=$(sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 \
              'cd /root/Xboard && docker inspect --format '\''{{index .Config.Labels "org.opencontainers.image.revision"}}'\'' "$(docker compose ps -q xboard)"')
            test "$actual" = "$EXPECTED_REVISION"
            apply_args=
            if [ "$OPERATION" = attach-owned-dedicated ]; then apply_args=--apply; fi
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 \
              "cd /root/Xboard && docker compose exec -T xboard php artisan dedicated:attach-owned 5 php://stdin $apply_args" \
              < .docker/dedicated/owned-production.json
            exit 0
          fi
          if [ "$OPERATION" = install-cli ] || [ "$OPERATION" = deploy ]; then
            bash -n .docker/production/xboard.sh
            remote_dir=$(sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 'mktemp -d /tmp/xboard-cli.XXXXXX')
            trap 'sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "rm -f -- $remote_dir/xboard; rmdir -- $remote_dir"' EXIT
            sshpass -e scp "${ssh_opts[@]}" .docker/production/xboard.sh "root@107.173.191.23:$remote_dir/xboard"
            sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 "bash '$remote_dir/xboard' install"
          fi
          sshpass -e ssh "${ssh_opts[@]}" root@107.173.191.23 \
            "bash -s -- '$OPERATION' '$EXPECTED_REVISION'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          operation="${1:-inspect}"
          expected_revision="${2:?Missing target revision}"

          # Only manage this saved production project. Never fall back to an
          # arbitrary container or the first Git checkout on a shared server.
          cd /root/Xboard
          docker compose config --services | grep -Fxq xboard
          docker compose ps xboard
          case "$operation" in
            inspect) exit 0 ;;
            inspect-mail)
              docker inspect --format 'Running image revision: {{index .Config.Labels "org.opencontainers.image.revision"}}' "$(docker compose ps -q xboard)"
              docker compose exec -T xboard php <<'PHP'
          <?php
          require '/www/vendor/autoload.php';
          $app = require '/www/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          // Read-only aggregates: never emit addresses, credentials, mail config or raw errors.
          $table = 'v2_traffic_exhausted_reminders';
          if (!Illuminate\Support\Facades\Schema::hasTable($table)) {
              throw new RuntimeException('Traffic exhausted reminder migration is missing.');
          }
          $exhausted = App\Models\User::where('transfer_enable', '>', 0)->whereRaw('u + d >= transfer_enable');
          $eligible = (clone $exhausted)->where('remind_traffic', true)->where('banned', false)
              ->whereNotNull('email')->where('email', '<>', '')->where('transfer_enable', '>', 0)
              ->whereRaw('u + d >= transfer_enable');
          $current = Illuminate\Support\Facades\DB::table($table . ' as reminders')
              ->join('v2_user as users', function ($join) {
                  $join->on('users.id', '=', 'reminders.user_id')->on('users.reset_count', '=', 'reminders.reset_count');
              });
          $logs = App\Models\MailLog::whereIn('template_name', ['mail.default.remindTrafficExhausted', 'db:remindTrafficExhausted'])
              ->where('created_at', '>=', time() - 86400);
          $lastSchedule = Illuminate\Support\Facades\Cache::get(App\Utils\CacheKey::get('SCHEDULE_LAST_CHECK_AT', null));
          echo json_encode([
              'configured_version' => config('app.version'),
              'remind_mail_enabled' => (bool) admin_setting('remind_mail_enable', false),
              'schedule_recent' => $lastSchedule && $lastSchedule > time() - 120,
              'schedule_last_runtime' => $lastSchedule,
              'eligible_users' => $eligible->count(),
              'exhausted_users' => $exhausted->count(),
              'exhausted_reminder_disabled' => (clone $exhausted)->where(fn ($q) => $q->whereNull('remind_traffic')->orWhere('remind_traffic', false))->count(),
              'exhausted_banned' => (clone $exhausted)->where('banned', true)->count(),
              'exhausted_missing_email' => (clone $exhausted)->where(fn ($q) => $q->whereNull('email')->orWhere('email', ''))->count(),
              'sent_current_cycle' => (clone $current)->whereNotNull('reminders.sent_at')->count(),
              'retrying_current_cycle' => (clone $current)->whereNull('reminders.sent_at')->count(),
              'last_success_at' => Illuminate\Support\Facades\DB::table($table)->max('sent_at'),
              'smtp_success_logs_last_24h' => (clone $logs)->whereNull('error')->count(),
              'smtp_error_logs_last_24h' => (clone $logs)->whereNotNull('error')->count(),
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          PHP
              ;;
            install-cli)
              bash -lc 'command -v xboard && xboard version'
              /usr/local/bin/xboard status
              # Exercise the menu without mutating the application.
              printf '0\n' | /usr/local/bin/xboard
              ;;
            deploy)
              XBOARD_EXPECTED_REVISION="$expected_revision" /usr/local/bin/xboard update --yes </dev/null
              ;;
            *) echo "Unsupported operation: $operation" >&2; exit 1 ;;
          esac
          REMOTE_SCRIPT
