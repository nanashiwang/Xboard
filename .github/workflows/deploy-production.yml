name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Remote operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy

permissions:
  contents: read
  packages: read

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install SSH client helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect or deploy production
        env:
          SSHPASS: ${{ secrets.XBOARD_SSH_PASSWORD }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test -n "$SSHPASS"
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -p 22 root@107.173.191.23 \
            "bash -s -- '$OPERATION' '$EXPECTED_REVISION'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          operation="${1:-inspect}"
          expected_revision="${2:?Missing target revision}"

          # Only manage this saved production project. Never fall back to an
          # arbitrary container or the first Git checkout on a shared server.
          cd /root/Xboard
          docker compose config --services | grep -Fxq xboard
          docker compose ps xboard
          [ "$operation" = "deploy" ] || exit 0

          docker compose pull xboard
          image=$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["xboard"]["image"])')
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          if [ "$revision" != "$expected_revision" ]; then
            echo "Image revision mismatch: expected $expected_revision, found $revision" >&2
            exit 1
          fi

          # Do not let the one-off container consume the SSH heredoc containing
          # the remaining deployment commands.
          docker compose run --rm -T xboard php artisan xboard:update </dev/null
          docker compose up -d xboard
          sleep 8
          container_id=$(docker compose ps -q xboard)
          test -n "$container_id"
          running_image=$(docker inspect --format '{{.Image}}' "$container_id")
          running_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$running_image")
          test "$running_revision" = "$expected_revision"
          test "$(docker inspect --format '{{.State.Running}}' "$container_id")" = true
          docker compose ps xboard
          echo "Deployed revision=$running_revision"
          REMOTE_SCRIPT
