name: Mail Reminder Checks
on:
  push:
    branches: [master]
    paths: ['app/**', 'config/**', 'database/**', 'resources/views/mail/**', 'tests/Feature/Mail/**', 'composer.*', '.github/workflows/mail-reminders.yml']
  pull_request:
    paths: ['app/**', 'config/**', 'database/**', 'resources/views/mail/**', 'tests/Feature/Mail/**', 'composer.*', '.github/workflows/mail-reminders.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, redis, gmp, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit tests/Feature/Mail
