name: Server Manager Checks

on:
  push:
    branches: [master]
    paths:
      - '.docker/production/xboard.sh'
      - '.docker/production/backup-database.py'
      - 'tests/Operations/**'
      - '.github/workflows/server-manager-check.yml'
      - '.github/workflows/deploy-production.yml'
  pull_request:
    paths:
      - '.docker/production/xboard.sh'
      - '.docker/production/backup-database.py'
      - 'tests/Operations/**'
      - '.github/workflows/server-manager-check.yml'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and failure handling
        run: |
          bash -n .docker/production/xboard.sh
          shellcheck .docker/production/xboard.sh
          python3 -m unittest discover -s tests/Operations -v
