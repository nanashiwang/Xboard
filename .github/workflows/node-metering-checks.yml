name: Node Metering Checks
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.docker/dedicated/build-node.sh'
      - '.docker/dedicated/node-*.patch'
      - '.github/workflows/node-metering-checks.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Test pinned node patches and build Linux binary
        run: bash .docker/dedicated/build-node.sh "$RUNNER_TEMP/xboard-node-linux-amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: xboard-node-linux-amd64
          path: ${{ runner.temp }}/xboard-node-linux-amd64
