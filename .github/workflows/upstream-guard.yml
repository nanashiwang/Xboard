name: Upstream Guard Regression

on:
  push:
    paths:
      - '.docker/upstream/**'
      - 'tests/Upstream/**'
      - '.github/workflows/upstream-guard.yml'
  pull_request:
    paths:
      - '.docker/upstream/**'
      - 'tests/Upstream/**'
      - '.github/workflows/upstream-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check TLS tooling and run isolated regression
        run: |
          openssl version
          python -m unittest discover -s tests/Upstream -v
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, redis, pcntl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify bounded transactions without production bootstrap
        run: |
          php -l .docker/upstream/snapshot.php
          php -l .docker/upstream/recovery.php
          php -l .docker/upstream/probe-scope.php
          php tests/Upstream/test-recovery.php
          php -l .docker/upstream/guard-apply.php
          php tests/Upstream/test-guard-apply.php
          php -l .docker/upstream/legacy-guard-scope.php
          sudo -- "$(command -v php)" tests/Upstream/test-legacy-guard-scope.php
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: .docker/upstream/quic-observer/go.sum
      - name: Verify QUIC certificate-only observer
        working-directory: .docker/upstream/quic-observer
        run: |
          go mod download
          go mod verify
          go test -mod=readonly -race ./...
