# taige.us only. Install in the shared Flawless Nginx http context.
# See .agents/notes/*/architecture/2026-10-22-website-flawless-relay.md.
upstream xboard_website_origin {
    server 107.173.191.23:443;
    keepalive 16;
}

map $http_upgrade $xboard_website_connection {
    default upgrade;
    ''      '';
}

# Subscription paths and query strings may contain credentials: log neither.
log_format xboard_website_safe '$time_iso8601 $remote_addr $request_method '
    '$status bytes=$body_bytes_sent total=$request_time upstream=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name taige.us;
    access_log /var/log/nginx/xboard-website.access.log xboard_website_safe;
    error_log /var/log/nginx/xboard-website.error.log crit;

    # Renew the relay locally, or forward the origin's separate challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/xboard-relay-acme;
        default_type text/plain;
        try_files $uri @xboard_origin_acme;
    }
    location @xboard_origin_acme {
        proxy_pass http://107.173.191.23;
        proxy_set_header Host taige.us;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache off;
    }
    location / { return 308 https://taige.us$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taige.us;
    ssl_certificate /etc/letsencrypt/live/taige.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taige.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    access_log /var/log/nginx/xboard-website.access.log xboard_website_safe;
    error_log /var/log/nginx/xboard-website.error.log crit;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    location / {
        proxy_pass https://xboard_website_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name taige.us;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host taige.us;
        # Never trust identity headers from public clients.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Host taige.us;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xboard_website_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_redirect off;
    }
}
