[package]
name = "capybara"
version = "0.1.0-alpha.5"
description = "卡皮巴拉桌面客户端"
authors = ["nanashiwang"]
license = "GPL-3.0-only"
edition = "2021"
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tauri-plugin-updater = "=2.14.0"
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }
